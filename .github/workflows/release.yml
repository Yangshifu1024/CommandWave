name: release

# Packaging pipeline: runs only on v* tags.
# Builds the Tauri bundles on macOS, Windows and Linux and attaches them to a
# draft GitHub release, which a maintainer reviews and publishes manually.
on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create.outputs.id }}
      release_notes: ${{ steps.notes.outputs.body }}
    steps:
      # Full history + tags so the notes step can diff against the previous tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      # generate_release_notes only lists merged PRs; this repo pushes release
      # commits directly, so list every commit between the previous tag and
      # this one; the same text feeds tauri-action's releaseBody below.
      - name: Build release notes
        id: notes
        run: |
          prev_tag=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## What's Changed"
            if [ -n "$prev_tag" ]; then
              git log --format='- %h %s' "${prev_tag}..${GITHUB_REF_NAME}"
              echo
              echo "Full Changelog: https://github.com/${GITHUB_REPOSITORY}/compare/${prev_tag}...${GITHUB_REF_NAME}"
            else
              echo "- First tagged release"
            fi
          } > release-notes.md
          {
            echo "body<<NOTES_EOF"
            cat release-notes.md
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
      # draft: tauri-action uploads artifacts but never publishes — a human
      # reviews assets/notes and hits publish manually.
      - name: Create draft release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: release-notes.md

  build-macos:
    name: Build (macOS)
    needs: prepare-release
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # Needed by tauri-action to upload assets and by `gh` in the dmg step.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      # pnpm version is read from the root package.json `packageManager` field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      # macOS signing/notarization secrets are all optional. The bundler treats
      # a "present but empty" env var as configured, and an empty
      # APPLE_CERTIFICATE crashes at keychain import, so only non-empty secrets
      # are exported; with none configured the build still emits an unsigned
      # .app/.dmg that needs a right-click -> Open on first launch.
      - name: Export optional macOS signing envs
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then
              echo "$name=$value" >> "$GITHUB_ENV"
            fi
          done
          # tauri-action does not write the .p8 file itself, so create it here.
          # APPLE_API_KEY_PATH must be absolute: the bundler invokes notarytool
          # from a temp dir, where a relative path fails with
          # "The file couldn't be opened".
          if [ -n "$APPLE_API_KEY" ]; then
            printf '%s\n' "$APPLE_API_KEY_P8" > AuthKey.p8
            grep -q '^-----BEGIN PRIVATE KEY-----$' AuthKey.p8 || {
              echo "::error::APPLE_API_KEY_P8 is missing the BEGIN PRIVATE KEY line; reset it with: gh secret set APPLE_API_KEY_P8 < AuthKey_XXX.p8"
              exit 1
            }
            grep -q '^-----END PRIVATE KEY-----$' AuthKey.p8 || {
              echo "::error::APPLE_API_KEY_P8 is missing the END PRIVATE KEY line; reset it with: gh secret set APPLE_API_KEY_P8 < AuthKey_XXX.p8"
              exit 1
            }
            echo "APPLE_API_KEY_PATH=${{ github.workspace }}/AuthKey.p8" >> "$GITHUB_ENV"
          fi
      - name: Tauri build
        uses: tauri-apps/tauri-action@action-v1.0.0
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          releaseBody: ${{ needs.prepare-release.outputs.release_notes }}
          args: --verbose
      # The bundler notarizes and staples the .app but only codesigns the dmg,
      # so the dmg carries no notarization ticket on its own and Gatekeeper
      # reports "Unnotarized Developer ID". Re-notarize + staple the dmg here
      # and replace the uploaded asset. Skipped when no notarization credentials
      # are configured.
      - name: Notarize and staple dmg
        run: |
          if [ -z "$APPLE_API_KEY" ]; then
            echo "No notarization credentials configured; skipping dmg notarization"
            exit 0
          fi
          gh release download "${GITHUB_REF_NAME}" --pattern '*.dmg' --clobber
          dmg=$(ls *.dmg | head -1)
          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          gh release upload "${GITHUB_REF_NAME}" "$dmg" --clobber

  build-linux:
    name: Build (Linux)
    needs: prepare-release
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install Tauri Linux deps
        run: |
          # The runner image ships Google's Chrome apt source, which
          # intermittently fails `apt-get update` with a hash mismatch;
          # it is irrelevant to this job, so drop it before updating.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.*
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: Tauri build
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          releaseBody: ${{ needs.prepare-release.outputs.release_notes }}
          args: --verbose

  build-windows:
    name: Build (Windows)
    needs: prepare-release
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: Tauri build
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          releaseBody: ${{ needs.prepare-release.outputs.release_notes }}
          args: --verbose
